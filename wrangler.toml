name = "smartassistant"
compatibility_date = "2024-12-30"
pages_build_output_dir = "."

# --- Bindings ---------------------------------------------------------------
# Replace the id below with the one printed when you create the database
# (see CLOUDFLARE_DEPLOY.md). For Pages, this can also be configured in the
# Cloudflare dashboard under Settings > Functions > Bindings.

[[d1_databases]]
binding = "DB"
database_name = "smartassistant"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# --- Public (non-secret) variables -----------------------------------------
[vars]
AVALAI_BASE_URL = "https://api.avalai.ir/v1"
AVALAI_MODEL = "gpt-4o-mini"
# Demo login credentials (hardcoded for product demos). Change these as needed.
DEMO_USERNAME = "admin"
DEMO_PASSWORD = "rayan@1404"
# Optional: bind the demo session to a specific employee code from D1.
# DEMO_EMPLOYEE_CODE = ""

# --- Secrets (DO NOT put real values here) ---------------------------------
# Set these with `wrangler pages secret put <NAME>` or in the dashboard:
#   JWT_SECRET      (required) random string used to sign session tokens
#   AVALAI_API_KEY  (required) AvalAI API key (Bearer)
