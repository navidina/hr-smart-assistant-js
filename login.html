<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود کارکنان - رایان هم‌افزا</title>
    <link rel="stylesheet" href="vendor/tailwind.min.css">
    <style>
        @font-face {
            font-family: "Hamishe";
            src: url("hamishe.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: "Hamishe", "Vazirmatn", sans-serif;
        }
    </style>
    <style>
        body {
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full">
        <!-- Logo and Title -->
        <div class="text-center mb-8">
            <div class="inline-block p-4 bg-white rounded-full shadow-lg mb-4">
                <svg class="w-16 h-16 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">ورود کارکنان</h1>
            <p class="text-gray-600">رایان هم‌افزا</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <form id="loginForm" class="space-y-6" autocomplete="on">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                        نام کاربری
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        placeholder="نام کاربری"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
                    />
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        رمز عبور
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="••••••••"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
                    />
                </div>

                <button
                    type="submit"
                    id="loginBtn"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center"
                >
                    <span>ورود</span>
                </button>
            </form>

            <!-- Messages -->
            <div id="message" class="hidden mt-4 p-4 rounded-lg" role="status" aria-live="polite" aria-atomic="true"></div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6 text-sm text-gray-600">
            <p>با ورود به سیستم، قوانین و مقررات شرکت را می‌پذیرید</p>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        try {
            window.sessionStorage.removeItem('rayan-entry-intro');
        } catch (error) {
            console.warn('Unable to reset entry intro flag', error);
        }

        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const messageDiv = document.getElementById('message');

        function showMessage(text, type = 'info') {
            messageDiv.textContent = text;
            messageDiv.className = `mt-4 p-4 rounded-lg ${
                type === 'error' ? 'bg-red-50 text-red-800 border border-red-200' :
                type === 'success' ? 'bg-green-50 text-green-800 border border-green-200' :
                'bg-blue-50 text-blue-800 border border-blue-200'
            }`;
            messageDiv.classList.remove('hidden');
        }

        function hideMessage() {
            messageDiv.classList.add('hidden');
        }

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                showMessage('لطفاً نام کاربری و رمز عبور را وارد کنید', 'error');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span>در حال ورود...</span>';
            hideMessage();

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('ورود موفقیت‌آمیز! در حال انتقال...', 'success');
                    try {
                        window.sessionStorage.setItem('rayan-entry-intro', 'pending');
                    } catch (error) {
                        console.warn('Unable to store entry intro flag', error);
                    }
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 800);
                } else {
                    showMessage(data.message || 'نام کاربری یا رمز عبور اشتباه است', 'error');
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            } catch (error) {
                showMessage('خطا در ارتباط با سرور', 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>ورود</span>';
            }
        });

        // Check if already logged in
        (async () => {
            try {
                const response = await fetch(`${API_BASE}/api/auth/session`);
                const data = await response.json();
                if (data.authenticated) {
                    window.location.href = '/index.html';
                }
            } catch (error) {
                // Not logged in, stay on login page
            }
        })();
    </script>
</body>
</html>
