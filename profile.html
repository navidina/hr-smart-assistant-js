<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل کاربری - رایان هم‌افزا</title>
    <link rel="stylesheet" href="vendor/tailwind.min.css">
    <style>
        @font-face {
            font-family: "Hamishe";
            src: url("hamishe.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        body {
            font-family: "Hamishe", "Vazirmatn", sans-serif;
        }
    </style>
    <style>
        body {
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    
    <!-- Navigation Bar -->
    <nav class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4 space-x-reverse">
                    <h1 class="text-xl font-bold text-gray-800">رایان هم‌افزا</h1>
                </div>
                <div class="flex items-center space-x-4 space-x-reverse">
                    <a href="/index.html" class="text-gray-600 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium transition">
                        دستیار هوشمند
                    </a>
                    <button id="logoutBtn" class="bg-red-100 hover:bg-red-200 text-red-700 px-4 py-2 rounded-lg text-sm font-medium transition">
                        خروج
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Loading State -->
        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
            <p class="mt-4 text-gray-600">در حال بارگذاری...</p>
        </div>

        <!-- Profile Content -->
        <div id="profileContent" class="hidden space-y-6">
            
            <!-- Profile Header Card -->
            <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                <div class="bg-gradient-to-r from-indigo-500 to-blue-600 px-8 py-12">
                    <div class="flex items-center space-x-6 space-x-reverse">
                        <div class="bg-white rounded-full p-4 shadow-lg">
                            <svg class="w-16 h-16 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                        <div class="text-white">
                            <h2 id="userName" class="text-3xl font-bold mb-2">-</h2>
                            <p id="userPost" class="text-blue-100 text-lg">-</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Personal Information -->
            <div class="bg-white rounded-2xl shadow-lg p-8">
                <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center">
                    <svg class="w-6 h-6 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"></path>
                    </svg>
                    اطلاعات شخصی
                </h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-gray-500">کد پرسنلی</label>
                        <p id="userCode" class="text-lg font-semibold text-gray-800">-</p>
                    </div>
                    
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-gray-500">کد ملی</label>
                        <p id="userNationalId" class="text-lg font-semibold text-gray-800 font-mono">-</p>
                    </div>
                    
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-gray-500">تاریخ تولد</label>
                        <p id="userBirthDate" class="text-lg font-semibold text-gray-800">-</p>
                    </div>
                    
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-gray-500">تاریخ استخدام</label>
                        <p id="userHireDate" class="text-lg font-semibold text-gray-800">-</p>
                    </div>
                </div>
            </div>

            <!-- Organizational Information -->
            <div class="bg-white rounded-2xl shadow-lg p-8">
                <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center">
                    <svg class="w-6 h-6 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                    </svg>
                    اطلاعات سازمانی
                </h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-gray-500">حوزه / معاونت</label>
                        <p id="userHoze" class="text-lg font-semibold text-gray-800">-</p>
                    </div>
                    
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-gray-500">بخش سازمانی</label>
                        <p id="userDepartment" class="text-lg font-semibold text-gray-800">-</p>
                    </div>
                    
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-gray-500">پست سازمانی</label>
                        <p id="userPost2" class="text-lg font-semibold text-gray-800">-</p>
                    </div>
                </div>
            </div>

            <!-- Contact Information -->
            <div class="bg-white rounded-2xl shadow-lg p-8">
                <h3 class="text-xl font-bold text-gray-800 mb-6 flex items-center">
                    <svg class="w-6 h-6 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                    </svg>
                    اطلاعات تماس
                </h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-gray-500">شماره موبایل</label>
                        <p id="userMobile" class="text-lg font-semibold text-gray-800 font-mono dir-ltr text-right">-</p>
                    </div>
                    
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-gray-500">شماره داخلی</label>
                        <p id="userExtension" class="text-lg font-semibold text-gray-800 font-mono">-</p>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="bg-gradient-to-r from-indigo-500 to-blue-600 rounded-2xl shadow-lg p-8">
                <h3 class="text-xl font-bold text-white mb-4">دسترسی سریع</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <a href="/index.html" class="bg-white hover:bg-gray-50 text-indigo-600 font-medium py-3 px-6 rounded-lg text-center transition shadow">
                        دستیار هوشمند HR
                    </a>
                    <button class="bg-white/20 hover:bg-white/30 text-white font-medium py-3 px-6 rounded-lg transition border-2 border-white/50">
                        درخواست‌های من
                    </button>
                </div>
            </div>

        </div>

        <!-- Error State -->
        <div id="errorState" class="hidden text-center py-12">
            <div class="bg-red-50 border border-red-200 rounded-xl p-8 max-w-md mx-auto">
                <svg class="w-16 h-16 text-red-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
                <h3 class="text-lg font-bold text-red-800 mb-2">خطا در بارگذاری پروفایل</h3>
                <p id="errorMessage" class="text-red-600 mb-4"></p>
                <a href="/login.html" class="inline-block bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-6 rounded-lg transition">
                    ورود مجدد
                </a>
            </div>
        </div>

    </div>

    <script>
        const API_BASE = window.location.origin;

        // Check authentication and load profile
        async function loadProfile() {
            try {
                // Check session
                const sessionResponse = await fetch(`${API_BASE}/api/auth/session`);
                const sessionData = await sessionResponse.json();

                if (!sessionData.authenticated) {
                    window.location.href = '/login.html';
                    return;
                }

                // Load profile
                const profileResponse = await fetch(`${API_BASE}/api/auth/profile`);
                const profileData = await profileResponse.json();

                if (!profileData.success || !profileData.profile) {
                    throw new Error(profileData.error || 'پروفایل یافت نشد');
                }

                const profile = profileData.profile;

                // Populate profile data
                document.getElementById('userName').textContent = profile.name || '-';
                document.getElementById('userPost').textContent = profile.post || '-';
                document.getElementById('userPost2').textContent = profile.post || '-';
                document.getElementById('userCode').textContent = profile.code || '-';
                document.getElementById('userNationalId').textContent = profile.national_id || '-';
                document.getElementById('userBirthDate').textContent = profile.birth_date || '-';
                document.getElementById('userHireDate').textContent = profile.hire_date || '-';
                document.getElementById('userHoze').textContent = profile.hoze || '-';
                document.getElementById('userDepartment').textContent = profile.department || '-';
                document.getElementById('userMobile').textContent = profile.mobile || '-';
                document.getElementById('userExtension').textContent = profile.extension || '-';

                // Show profile
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('profileContent').classList.remove('hidden');

            } catch (error) {
                console.error('Profile load error:', error);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('errorState').classList.remove('hidden');
                document.getElementById('errorMessage').textContent = error.message;
            }
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            try {
                await fetch(`${API_BASE}/api/auth/logout`, { method: 'POST' });
                window.location.href = '/login.html';
            } catch (error) {
                console.error('Logout error:', error);
                window.location.href = '/login.html';
            }
        });

        // Load profile on page load
        loadProfile();
    </script>
</body>
</html>
